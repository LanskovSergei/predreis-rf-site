# Конфиг для nginx НА ХОСТЕ (не в контейнере). Кладётся в
# /etc/nginx/sites-available/gsm-demo, симлинкается в sites-enabled.
# Домен подставить свой. SSL — через certbot --nginx (см. DEPLOY.md).
#
# Может стоять на том же сервере, что и бэкенд EPL_Calculator (другой
# поддомен/порт), или на отдельном — неважно, демо обращается к бэкенду
# по полному адресу (VITE_API_URL), не по относительному пути.

server {
    listen 80;
    listen [::]:80;
    server_name demo.example.ru;  # TODO: заменить на реальный домен

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
